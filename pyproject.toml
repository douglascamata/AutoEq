[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[project]
name = "autoeq"
version = "4.1.2"
authors = [
  { name="Jaakko Pasanen", email="jaakko.o.pasanen@gmail.com" },
]
description = "Automatic headphone equalizer config generator"
readme = "README.md"
requires-python = ">=3.8,<3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    'Pillow~=10.0.1',
    'matplotlib~=3.7.3',
    'scipy~=1.10.1',
    'numpy~=1.24.4',
    'tabulate~=0.9.0',
    'soundfile~=0.12.1',
    'pyyaml~=6.0',
    'tqdm~=4.66.1',
]

[project.urls]
"Homepage" = "https://github.com/jaakkopasanen/AutoEq"
"Bug Tracker" = "https://github.com/jaakkopasanen/AutoEq/issues"

[dependency-groups]
webapp = [
    "fastapi~=0.88.0",
    "uvicorn[standard]~=0.20.0",
]
dbtools = [
    "requests~=2.31.0",
    "pandas~=2.1.1",
    "PyPDF2~=3.0.1",
    "ghostscript~=0.7",
    "beautifulsoup4~=4.12.2",
    "selenium~=4.14.0",
    "rapidfuzz~=3.4.0",
    "icrawler~=0.6.7",
    "ipywidgets~=8.1.1",
    "jupyterlab~=4.0.7",
]

[tool.uv]
# Resolve direct dependencies to the exact versions named in their `~=` specifiers (e.g. matplotlib 3.7.3, not the
# newest 3.7.x), so the development environment uses the same versions upstream AutoEq specifies.
resolution = "lowest-direct"
# `uv sync` installs every group by default; use `--no-default-groups --group <name>` for a subset
default-groups = "all"
# Only lock for the Python versions used for development (see mise.toml). The published package's
# `requires-python` stays wider, but some dev tool pins (e.g. pandas 2.1) don't support Python 3.8.
environments = ["python_version >= '3.11'"]

[tool.hatch.build]
include = [
    "/autoeq",
    "LICENCE",
    "pyproject.toml",
]
exclude = [
    "/.github",
    "/targets",
    "/measurements",
    "/results",
    "/tests",
    ".gitignore",
    "/autoeq/README.md"
]
